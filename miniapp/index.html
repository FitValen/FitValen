ht:7px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.055);margin-top:13px}.progressbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2))}.metric{padding:14px 12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;min-width:0}.metric .stat{font-size:20px}.metric .small{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brain{border-color:rgba(103,228,147,.18);background:linear-gradient(145deg,rgba(103,228,147,.085),var(--panel))}.braintext{font-size:14px;font-weight:850;line-height:1.46;margin-top:8px}

.empty{padding:25px 10px;text-align:center;color:var(--muted);font-size:12px}.skeleton{height:115px;border-radius:22px;background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sk 1.35s linear infinite;border:1px solid var(--line);margin-bottom:10px}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}.error{border-color:rgba(255,118,111,.32);background:rgba(255,118,111,.06)}.loading{pointer-events:none}.spin{animation:spin .65s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(9,11,15,.96);border-top:1px solid var(--line);padding:7px 8px calc(7px + var(--safe));backdrop-filter:blur(18px)}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.nav button{border:0;background:transparent;color:var(--muted);min-height:58px;border-radius:15px;font-size:10px;font-weight:900}.nav button span{display:block;font-size:21px;margin-bottom:2px}.nav button.on{color:var(--accent2);background:rgba(103,228,147,.075)}

<body>
<div class="app" id="app"><header class="topbar"><div class="brandrow"><div class="logo">FV</div><div><div class="brand">FITVALEN</div><div class="status" id="status">Conectando…</div></div></div><div class="topactions"><button class="iconbtn" id="refresh">↻</button></div></header><section class="screen on" id="screen-home"><div id="home"><div class="skeleton"></div><div class="skeleton"></div></div></section><section class="screen" id="screen-diet"><div id="diet"><div class="skeleton"></div><div class="skeleton"></div></div></section><section class="screen" id="screen-work"><div id="work"><div class="skeleton"></div><div class="skeleton"></div></div></section><section class="screen" id="screen-progress"><div id="progress"><div class="skeleton"></div><div class="skeleton"></div></div></section></div>

<div class="overlay" id="overlay"><div class="sheet"><div class="grab"></div><div id="sheet"></div></div></div><div class="toast" id="toast"></div>
<script>
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
window.onerror=function(message,source,line,column){var s=document.getElementById('status'),h=document.getElementById('home');if(s){s.textContent='Error JavaScript'}if(h){h.innerHTML='<div class="card error"><div class="ey">Error</div><div class="braintext">No se pudo iniciar FitValen.</div><div class="small" style="margin-top:7px">'+escapeHtml(String(message||'Error'))+' · línea '+String(line||'?')+':'+String(column||'?')+'</div></div>'}};
</script>
<script>
(function(){
var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null,initData='',currentTab='home';
var state={home:null,diet:null,work:null,progress:null,loaded:{home:false,diet:false,work:false,progress:false},selectedDay:1};
var app=document.getElementById('app'),status=document.getElementById('status'),refresh=document.getElementById('refresh'),overlay=document.getElementById('overlay'),sheet=document.getElementById('sheet');
var mealInfo={'ayunas':['🌅','Ayunas'],'desayuno':['🍳','Desayuno'],'almuerzo':['🥪','Almuerzo'],'comida':['🍽️','Comida'],'merienda':['🥛','Merienda'],'post-entreno':['🍍','Post-entreno'],'cena':['🌙','Cena'],'postre':['🍓','Postre'],'snacks':['🍫','Snacks'],'salsas':['🥫','Salsas'],'antes de dormir':['💊','Antes de dormir']};
function get(id){return document.getElementById(id)}function num(v){var x=parseFloat(v);return isNaN(x)?0:x}function fmt(v,d){return num(v).toLocaleString('es-ES',{maximumFractionDigits:d==null?1:d})}function safeArray(x){return x&&x.length?x:[]}function setBusy(on){if(on){app.className='app loading';refresh.className='iconbtn spin'}else{app.className='app';refresh.className='iconbtn'}}function haptic(){try{if(tg&&tg.HapticFeedback){tg.HapticFeedback.impactOccurred('light')}}catch(ignore){}}function notify(text){var e=get('toast');e.textContent=text;e.className='toast on';setTimeout(function(){e.className='toast'},1800)}function closeSheet(){overlay.className='overlay'}function openSheet(html){sheet.innerHTML=html;overlay.className='overlay on';haptic()}overlay.onclick=function(e){if(e.target===overlay){closeSheet()}};
function showError(text){status.textContent='Error';get(currentTab==='work'?'work':currentTab).innerHTML='<div class="card error"><div class="ey">Conexión</div><div class="braintext">No se pudo completar la acción.</div><div class="small" style="margin-top:7px">'+escapeHtml(text)+'</div></div>'}
function brainText(b){if(!b){return 'Datos preparados.'}if(typeof b==='string'){return b}if(b.headline){return String(b.headline)}if(b.verdict){return String(b.verdict)}if(b.message){return String(b.message)}if(b.summary){return String(b.summary)}return 'Datos preparados.'}
function statusPill(s){if(s&&s.status==='closed'){return '<span class="pill good"><i class="dot"></i>Cerrado</span>'}if(s&&s.id){return '<span class="pill good"><i class="dot"></i>En curso</span>'}return '<span class="pill warn"><i class="dot"></i>Sin iniciar</span>'}
if(tg){try{tg.ready();tg.expand()}catch(a){}try{initData=tg.initData||''}catch(b){initData=''}try{tg.setHeaderColor('#090b0f');tg.setBackgroundColor('#090b0f')}catch(c){}}
if(!initData){status.textContent='Abre desde Telegram';get('home').innerHTML='<div class="hero"><div class="ey">FitValen Mini App</div><div class="big" style="font-size:27px">Sesión no disponible</div><div class="small">Abre FitValen desde el botón del bot.</div></div>';return}
function api(action,payload){return fetch(window.location.href,{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':initData},body:JSON.stringify({action:action,payload:payload||{}})}).then(function(r){return r.text().then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw new Error('Respuesta no válida del servidor')}if(!r.ok||!j.ok){throw new Error(j.reason||j.error||('HTTP '+r.status))}return j.data})})}
function load(action,key,renderer,force){if(state.loaded[key]&&!force){renderer(state[key]);return Promise.resolve(state[key])}setBusy(true);return api(action,{}).then(function(data){state[key]=data;state.loaded[key]=true;renderer(data);status.textContent='Conectado';setBusy(false);return data}).catch(function(error){setBusy(false);showError(error&&error.message?error.message:String(error))})}
function mutate(action,payload,done){setBusy(true);return api(action,payload).then(function(data){setBusy(false);haptic();if(done){done(data)}return data}).catch(function(error){setBusy(false);notify(error&&error.message?error.message:String(error));throw error})}
function mealTotals(d){var totals={},foods=safeArray(d&&d.foods);for(var i=0;i<foods.length;i++){var slot=String(foods[i].meal_slot||'otros');if(!totals[slot]){totals[slot]={count:0,kcal:0}}totals[slot].count++;totals[slot].kcal+=num(foods[i].calories)}return totals}

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d11">
<title>FitValen</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0d11;--panel:#151922;--card:#1b202b;--text:#f5f7fa;--muted:#8d96a8;--accent:#64dc8a;--line:rgba(255,255,255,.08);--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:calc(76px + var(--safe));min-height:100vh}button{font:inherit}.app{max-width:720px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 14px}.brand{font-weight:900;letter-spacing:.08em}.status{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:0}.badge{font-size:11px;font-weight:800;color:var(--accent);border:1px solid rgba(100,220,138,.28);background:rgba(100,220,138,.08);padding:7px 9px;border-radius:999px}.screen{display:none}.screen.on{display:block}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px}.hero{padding:19px;margin-bottom:10px}.card{padding:14px;margin-bottom:9px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.big{font-size:36px;font-weight:900;line-height:1.05;margin:8px 0}.stat{font-size:21px;font-weight:900;margin-top:6px}.small{font-size:12px;color:var(--muted);line-height:1.45}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.section{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850;margin:17px 2px 8px}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item b{display:block;font-size:14px}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,13,17,.96);border-top:1px solid var(--line);padding:7px 8px calc(7px + var(--safe));z-index:20}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:var(--muted);min-height:52px;border-radius:13px;font-size:11px;font-weight:800}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav button.on{color:var(--accent);background:rgba(100,220,138,.08)}.error{border-color:rgba(255,109,103,.35)}.loading{opacity:.65}@media(max-width:380px){.app{padding-left:11px;padding-right:11px}.big{font-size:32px}.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><div class="brand">FITVALEN<div class="status" id="status">Conectando…</div></div><div class="badge">SOLO LECTURA</div></div>
  <section class="screen on" id="screen-home"><div id="home"><div class="card">Cargando…</div></div></section>
  <section class="screen" id="screen-diet"><div id="diet"><div class="card">Pulsa Dieta para cargar.</div></div></section>
  <section class="screen" id="screen-work"><div id="work"><div class="card">Pulsa Entreno para cargar.</div></div></section>
  <section class="screen" id="screen-progress"><div id="progress"><div class="card">Pulsa Progreso para cargar.</div></div></section>
</div>
<nav class="nav"><div class="navin">
  <button class="on" data-tab="home"><span>⚡</span>Hoy</button>
  <button data-tab="diet"><span>🍽️</span>Dieta</button>
  <button data-tab="work"><span>🏋️</span>Entreno</button>
  <button data-tab="progress"><span>📈</span>Progreso</button>
</div></nav>
<script>
window.onerror=function(message,source,line,column){
  var s=document.getElementById('status');
  var h=document.getElementById('home');
  if(s){s.textContent='Error JavaScript';}
  if(h){h.innerHTML='<div class="card error"><b>No se pudo iniciar FitValen.</b><div class="small" style="margin-top:8px">'+escapeHtml(String(message||'Error'))+' · línea '+String(line||'?')+':'+String(column||'?')+'</div></div>';}
};
function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
</script>
<script>
(function(){
  var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
  var initData='';
  var state={home:null,diet:null,work:null,progress:null,loaded:{home:false,diet:false,work:false,progress:false}};
  var app=document.getElementById('app');
  var status=document.getElementById('status');

  function get(id){return document.getElementById(id);}
  function num(v){var x=parseFloat(v);return isNaN(x)?0:x;}
  function fmt(v,d){return num(v).toLocaleString('es-ES',{maximumFractionDigits:d==null?1:d});}
  function setBusy(on){if(on){app.className='app loading';}else{app.className='app';}}
  function showError(text){status.textContent='Error de conexión';get('home').innerHTML='<div class="card error"><b>No se pudo conectar.</b><div class="small" style="margin-top:8px">'+escapeHtml(text)+'</div></div>';}

  if(tg){
    try{tg.ready();tg.expand();}catch(ignore){}
    try{initData=tg.initData||'';}catch(ignore2){initData='';}
  }
  if(!initData){
    status.textContent='Abre desde Telegram';
    get('home').innerHTML='<div class="hero"><div class="ey">FitValen Mini App</div><div class="stat">Ábrela desde el botón del bot.</div><div class="small" style="margin-top:8px">Telegram debe entregar una sesión firmada para poder consultar tus datos.</div></div>';
    return;
  }

  function api(action){
    return fetch(window.location.href,{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':initData},body:JSON.stringify({action:action,payload:{}})}).then(function(response){
      return response.text().then(function(text){
        var data;
        try{data=JSON.parse(text);}catch(parseError){throw new Error('Respuesta no válida del servidor');}
        if(!response.ok||!data.ok){throw new Error(data.reason||data.error||('HTTP '+response.status));}
        return data.data;
      });
    });
  }

  function load(name,renderer){
    setBusy(true);
    return api(name).then(function(data){
      state[name==='workouts'?'work':name]=data;
      state.loaded[name==='workouts'?'work':name]=true;
      renderer(data);
      status.textContent='Conectado · lectura segura';
      setBusy(false);
      return data;
    }).catch(function(error){
      setBusy(false);
      showError(error&&error.message?error.message:String(error));
    });
  }

  function renderHome(h){
    var s=h&&h.session?h.session:{};
    var k=num(s.calories_total),p=num(s.protein_g),c=num(s.carbs_g),f=num(s.fat_g);
    var dayState=s.status==='closed'?'Día cerrado':(s.id?'Día en curso':'Sin iniciar');
    var workout='Sin entrenamiento';
    if(h&&h.activeWorkout&&h.activeWorkout.workout){workout='Día '+escapeHtml(h.activeWorkout.workout.workout_day)+' · en curso';}
    else if(h&&h.lastWorkout){workout='Día '+escapeHtml(h.lastWorkout.workout_day)+' · '+escapeHtml(h.lastWorkout.status||'');}
    var weight=h&&h.latestWeight?fmt(h.latestWeight.weight_kg,2)+' kg':'—';
    get('home').innerHTML='<div class="hero"><div class="ey">Hoy · '+escapeHtml(h.date||'')+'</div><div class="big">'+Math.round(k)+' <span style="font-size:14px;color:var(--muted)">kcal</span></div><div class="small">'+escapeHtml(dayState)+'</div></div>'+
      '<div class="grid3"><div class="card"><div class="stat">'+fmt(p,1)+'</div><div class="small">Proteína g</div></div><div class="card"><div class="stat">'+fmt(c,1)+'</div><div class="small">Hidratos g</div></div><div class="card"><div class="stat">'+fmt(f,1)+'</div><div class="small">Grasas g</div></div></div>'+
      '<div class="grid2"><div class="card"><div class="ey">🏋️ Entrenamiento</div><div class="stat" style="font-size:16px">'+workout+'</div></div><div class="card"><div class="ey">⚖️ Peso</div><div class="stat">'+weight+'</div></div></div>'+
      '<div class="card"><div class="ey">🍽️ Registros hoy</div><div class="stat">'+String(h&&h.foodCount?h.foodCount:0)+'</div></div>';
  }

  function renderDiet(d){
    var s=d&&d.session?d.session:{};
    var foods=d&&d.foods?d.foods:[];
    var blocks=d&&d.blocks?d.blocks:[];
    var html='<div class="hero"><div class="ey">Dieta</div><div class="big">'+Math.round(num(s.calories_total))+' <span style="font-size:14px;color:var(--muted)">kcal</span></div><div class="small">'+(s.diet_status==='closed'?'Cerrada':'Abierta')+'</div></div>';
    html+='<div class="section">Bloques del plan</div><div class="card">';
    if(!blocks.length){html+='<div class="small">Sin bloques disponibles.</div>';}
    for(var i=0;i<blocks.length;i++){html+='<div class="item"><b>'+escapeHtml(blocks[i].slot||'')+'</b><div class="small">Plan vigente disponible</div></div>';}
    html+='</div><div class="section">Comido hoy</div><div class="card">';
    if(!foods.length){html+='<div class="small">Sin alimentos registrados.</div>';}
    for(var j=0;j<foods.length;j++){html+='<div class="item"><b>'+escapeHtml(foods[j].product_name||'')+'</b><div class="small">'+fmt(foods[j].quantity,1)+' '+escapeHtml(foods[j].unit||'')+' · '+Math.round(num(foods[j].calories))+' kcal</div></div>';}
    html+='</div>';
    get('diet').innerHTML=html;
  }

  function groupLatest(plan,lastSets){
    var out={};
    var i;
    for(i=0;i<lastSets.length;i++){var code=String(lastSets[i].exercise_code||'');if(!out[code]){out[code]=[];}out[code].push(lastSets[i]);}
    var html='';
    for(i=0;i<plan.length;i++){
      var e=plan[i],sets=out[String(e.exercise_code||'')]||[];
      var last=[];
      for(var j=0;j<sets.length;j++){last.push((num(sets[j].weight_kg)?fmt(sets[j].weight_kg,2)+' kg × ':'')+String(sets[j].reps||''));}
      html+='<div class="item"><b>'+escapeHtml(e.exercise_code)+'. '+escapeHtml(e.exercise_name)+'</b><div class="small">'+escapeHtml(e.prescription||'')+(last.length?' · Última: '+escapeHtml(last.join(' · ')):'')+'</div></div>';
    }
    return html;
  }

  function renderWork(w){
    var html='<div class="hero"><div class="ey">Entrenamiento</div><div class="big">Días 1–5</div><div class="small">Rutina vigente y última sesión real.</div></div>';
    if(w&&w.active&&w.active.workout){html+='<div class="card"><div class="ey">Sesión activa</div><div class="stat">Día '+escapeHtml(w.active.workout.workout_day)+'</div></div>';}
    for(var d=1;d<=5;d++){
      var p=w&&w.plans?w.plans[d]:null;
      var plan=p&&p.plan?p.plan:[];
      var lastSets=p&&p.lastSets?p.lastSets:[];
      html+='<div class="section">Día '+d+(p&&p.lastDate?' · '+escapeHtml(p.lastDate):'')+'</div><div class="card">'+(plan.length?groupLatest(plan,lastSets):'<div class="small">Sin rutina.</div>')+'</div>';
    }
    get('work').innerHTML=html;
  }

  function renderProgress(p){
    var wt=p&&p.weightTrend?p.weightTrend:{};
    var nu=p&&p.nutrition?p.nutrition:{};
    var cur=nu&&nu.current7?nu.current7:{};
    var html='<div class="hero"><div class="ey">Progreso</div><div class="big">'+(wt.latest_weight!=null?fmt(wt.latest_weight,2)+' <span style="font-size:14px;color:var(--muted)">kg</span>':'—')+'</div><div class="small">'+(wt.sufficient?escapeHtml(wt.state||'Tendencia disponible'):'Datos de peso insuficientes')+'</div></div>';
    html+='<div class="grid3"><div class="card"><div class="stat">'+Math.round(num(cur.avg_kcal))+'</div><div class="small">kcal/día · 7d</div></div><div class="card"><div class="stat">'+fmt(cur.avg_protein,1)+'</div><div class="small">g proteína · 7d</div></div><div class="card"><div class="stat">'+Math.round(num(cur.adherence_pct))+'%</div><div class="small">adherencia</div></div></div>';
    html+='<div class="section">Entrenamiento</div>';
    for(var d=1;d<=5;d++){var x=p&&p.workoutProgress?p.workoutProgress[d]:null;x=x||{};html+='<div class="card"><div class="row"><b>Día '+d+'</b><div class="small">'+String(x.suggestions||0)+' sugerencias</div></div><div class="small" style="margin-top:7px">Mejorando '+String(x.improving||0)+' · Estables '+String(x.stable||0)+' · Estancados '+String(x.stagnating||0)+'</div></div>';}
    get('progress').innerHTML=html;
  }

  function selectTab(name){
    var screens=document.querySelectorAll('.screen');
    var buttons=document.querySelectorAll('.nav button');
    var i;
    for(i=0;i<screens.length;i++){screens[i].className='screen'+(screens[i].id==='screen-'+name?' on':'');}
    for(i=0;i<buttons.length;i++){buttons[i].className=buttons[i].getAttribute('data-tab')===name?'on':'';}
    if(name==='diet'&&!state.loaded.diet){load('diet',renderDiet);}
    if(name==='work'&&!state.loaded.work){load('workouts',renderWork);}
    if(name==='progress'&&!state.loaded.progress){load('progress',renderProgress);}
  }

  var navButtons=document.querySelectorAll('.nav button');
  for(var n=0;n<navButtons.length;n++){
    navButtons[n].onclick=function(){selectTab(this.getAttribute('data-tab'));};
  }

  load('home',renderHome);
})();
</script>
</body>
</html>

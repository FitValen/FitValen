<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d11">
<title>FitValen</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#0b0d11);--panel:var(--tg-theme-secondary-bg-color,#151922);--card:#1b202b;--text:var(--tg-theme-text-color,#f5f7fa);--muted:var(--tg-theme-hint-color,#8d96a8);--accent:var(--tg-theme-button-color,#64dc8a);--accentText:var(--tg-theme-button-text-color,#071009);--line:rgba(255,255,255,.08);--danger:#ff6d67;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{padding-bottom:calc(78px + var(--safe));min-height:100vh}button,input{font:inherit}.app{max-width:720px;margin:auto;padding:14px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;padding:7px 0 14px;background:linear-gradient(var(--bg) 78%,transparent)}.brand{font-weight:950;letter-spacing:.08em}.sub{font-size:11px;color:var(--muted);font-weight:650;margin-top:3px;letter-spacing:0}.screen{display:none}.screen.on{display:block}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:22px}.hero{padding:20px;margin-bottom:11px;background:linear-gradient(145deg,#222936,var(--panel))}.card{padding:15px;margin-bottom:9px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850}.big{font-size:38px;font-weight:950;line-height:1;margin:8px 0}.small{font-size:12px;color:var(--muted)}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{font-size:22px;font-weight:950}.pill{padding:7px 10px;border-radius:999px;background:var(--card);font-size:11px;font-weight:850;color:var(--muted)}.pill.good{color:var(--accent)}.progress{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--accent);border-radius:inherit}.section{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.07em;margin:18px 2px 9px}.btn{border:0;border-radius:15px;min-height:47px;padding:11px 14px;font-weight:900}.primary{background:var(--accent);color:var(--accentText)}.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.danger{background:rgba(255,109,103,.13);color:var(--danger);border:1px solid rgba(255,109,103,.22)}.wide{width:100%}.slot{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:8px}.slot b{font-size:15px}.slot span{font-size:12px;color:var(--muted)}.food{padding:10px 0;border-bottom:1px solid var(--line)}.food:last-child{border:0}.food b{display:block}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:5px;scrollbar-width:none}.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:9px 11px;white-space:nowrap;min-height:42px;font-weight:850}.chip.on{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.work h2{font-size:22px;line-height:1.15;margin:6px 0}.ref{background:rgba(255,255,255,.04);border-radius:14px;padding:11px;margin-top:10px;font-size:12px}.set{display:grid;grid-template-columns:38px 1fr 1fr 44px 44px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}input{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px;outline:none;font-size:16px}.flag{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted)}.flag.on{color:var(--accent);border-color:rgba(100,220,138,.4);background:rgba(100,220,138,.1)}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,13,17,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:7px 8px calc(7px + var(--safe));z-index:30}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:var(--muted);min-height:54px;border-radius:13px;font-size:11px;font-weight:850}.nav button i{display:block;font-style:normal;font-size:21px;margin-bottom:2px}.nav button.on{color:var(--accent);background:rgba(100,220,138,.08)}.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.58);display:none;align-items:flex-end}.overlay.on{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:var(--bg);border-radius:25px 25px 0 0;border:1px solid var(--line);border-bottom:0;padding:14px 14px calc(20px + var(--safe));max-height:84vh;overflow:auto}.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 13px}.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe));transform:translateX(-50%);background:#f5f7fa;color:#11151a;border-radius:13px;padding:10px 14px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.18s;z-index:80}.toast.on{opacity:1}.loading{opacity:.55;pointer-events:none}.empty{text-align:center;color:var(--muted);padding:25px 10px}.stack{display:flex;flex-direction:column;gap:8px}@media(max-width:380px){.app{padding-left:11px;padding-right:11px}.big{font-size:34px}.set{grid-template-columns:32px 1fr 1fr 41px 41px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><div class="brand">FITVALEN<div class="sub" id="status">Conectando…</div></div><button class="btn secondary" id="more">•••</button></header>
<section class="screen on" id="s-home"><div id="home"><div class="card">Cargando…</div></div></section>
<section class="screen" id="s-diet"><div id="diet"><div class="card">Cargando…</div></div></section>
<section class="screen" id="s-work"><div id="work"><div class="card">Cargando…</div></div></section>
<section class="screen" id="s-progress"><div id="progress"><div class="card">Cargando…</div></div></section>
</div>
<nav class="nav"><div class="navin"><button class="on" data-tab="home"><i>⚡</i>Hoy</button><button data-tab="diet"><i>🍽️</i>Dieta</button><button data-tab="work"><i>🏋️</i>Entreno</button><button data-tab="progress"><i>📈</i>Progreso</button></div></nav>
<div class="overlay" id="overlay"><div class="sheet"><div class="grab"></div><div id="sheet"></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('secondary_bg_color');tg.setBackgroundColor('bg_color')}catch{}}const init=tg?.initData||'';const st={home:null,diet:null,work:null,progress:null,busy:false};const $=q=>document.querySelector(q),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const n=x=>Number(x||0),fmt=x=>n(x).toLocaleString('es-ES',{maximumFractionDigits:1}),kg=x=>n(x).toLocaleString('es-ES',{maximumFractionDigits:2});function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1700)}function busy(v){st.busy=v;$('#app').classList.toggle('loading',v)}async function api(action,payload={}){if(!init)throw Error('Abre FitValen desde Telegram');const r=await fetch(location.href,{method:'POST',headers:{'content-type':'application/json','x-telegram-init-data':init},body:JSON.stringify({action,payload})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||j.reason||'Error');return j.data}async function call(a,p={},fn){try{busy(true);const d=await api(a,p);if(fn)await fn(d);try{tg?.HapticFeedback?.impactOccurred('light')}catch{}return d}catch(e){toast(e.message);throw e}finally{busy(false)}}function tab(t){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id==='s-'+t));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));if(t==='diet')loadDiet();if(t==='work')loadWork();if(t==='progress')loadProgress()}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));function sheet(h){$('#sheet').innerHTML=h;$('#overlay').classList.add('on')}function close(){ $('#overlay').classList.remove('on')}$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))close()});const slots={ayunas:['🌅','Ayunas'],desayuno:['🍳','Desayuno'],almuerzo:['🥪','Almuerzo'],comida:['🍽️','Comida'],merienda:['🥛','Merienda'],'post-entreno':['🍍','Post-entreno'],cena:['🌙','Cena'],postre:['🍓','Postre'],snacks:['🍫','Snacks'],salsas:['🥫','Salsas'],'antes de dormir':['💊','Antes de dormir']};
function renderHome(){const h=st.home;if(!h)return;const s=h.session||{},free=!!s.full_free_day,k=n(s.calories_total),p=n(s.protein_g),c=n(s.carbs_g),f=n(s.fat_g),brain=h.brain?.headline||h.brain?.verdict||'Listo.';$('#status').textContent=(s.status==='closed'?'Día cerrado':s.id?'Día en curso':'Sin iniciar')+' · '+h.date;$('#home').innerHTML=`<div class="hero"><div class="row between"><div><div class="ey">Hoy · ${esc(h.date)}</div><div class="big">${free?'DÍA LIBRE':Math.round(k)+' <span style="font-size:14px;color:var(--muted)">kcal</span>'}</div></div><span class="pill ${s.status==='closed'?'good':''}">${s.status==='closed'?'● Cerrado':'● En curso'}</span></div>${free?'<div class="small">Kcal y macros no contabilizados.</div>':`<div class="progress"><i style="width:${Math.min(100,k/18)}%"></i></div><div class="small" style="margin-top:7px">Objetivo 1500–1800 kcal</div>`}</div><div class="grid3"><div class="card"><div class="stat">${fmt(p)}</div><div class="small">Proteína g</div></div><div class="card"><div class="stat">${fmt(c)}</div><div class="small">Hidratos g</div></div><div class="card"><div class="stat">${fmt(f)}</div><div class="small">Grasas g</div></div></div><div class="card"><div class="ey">🏋️ Entrenamiento</div><div class="row between" style="margin-top:8px"><b>${h.activeWorkout?'Día '+h.activeWorkout.workout.workout_day+' · en curso':h.lastWorkout?'Día '+h.lastWorkout.workout_day+' · '+h.lastWorkout.status:'Sin entrenamiento'}</b><button class="btn secondary" id="goWork">${h.activeWorkout?'Continuar':'Abrir'}</button></div>${h.activeWorkout?.exercise?`<div class="small" style="margin-top:8px">▶️ ${esc(h.activeWorkout.exercise.exercise_code)}. ${esc(h.activeWorkout.exercise.exercise_name)}</div>`:''}</div><div class="grid2"><div class="card"><div class="ey">Peso</div><div class="stat">${h.latestWeight?kg(h.latestWeight.weight_kg)+' kg':'—'}</div></div><div class="card"><div class="ey">Comido hoy</div><div class="stat">${h.foodCount||0}</div><div class="small">registros</div></div></div><div class="card"><div class="ey">⚡ Ahora</div><b style="display:block;margin-top:8px;line-height:1.35">${esc(brain)}</b></div><div class="grid2"><button class="btn primary" id="start">⚡ Iniciar día</button><button class="btn secondary" id="weight">⚖️ Peso</button></div>`;$('#goWork').onclick=()=>tab('work');$('#start').onclick=()=>call('start_day',{},d=>{st.home=d;renderHome();toast('Día listo')});$('#weight').onclick=weightSheet}
async function loadHome(){st.home=await call('home');renderHome()}
function renderDiet(){const d=st.diet;if(!d)return;const s=d.session||{};const grouped={};d.foods.forEach(x=>(grouped[x.meal_slot||'otros']??=[]).push(x));const order=d.blocks.map(x=>x.slot);const list=[...order,...Object.keys(slots).filter(x=>!order.includes(x))];$('#diet').innerHTML=`<div class="row between"><div><div class="ey">Dieta</div><div class="stat">${Math.round(n(s.calories_total))} kcal</div></div><span class="pill ${s.diet_status==='closed'?'good':''}">${s.diet_status==='closed'?'Cerrada':'Abierta'}</span></div><div class="section">Comidas</div>${list.map(x=>{const m=slots[x]||['🍴',x],cnt=(grouped[x]||[]).length;return `<button class="slot" data-slot="${esc(x)}"><b>${m[0]} ${esc(m[1])}</b><span>${cnt?cnt+' registros':'Ver opciones'} ›</span></button>`}).join('')}<div class="section">Comido hoy</div><div class="card">${d.foods.length?d.foods.map(x=>`<div class="food"><b>${esc(x.product_name)}</b><div class="small">${fmt(x.quantity)} ${esc(x.unit||'')} · ${Math.round(n(x.calories))} kcal</div></div>`).join(''):'<div class="empty">Sin alimentos registrados.</div>'}</div>${s.diet_status==='closed'?'':`<button class="btn primary wide" id="closeDiet">✅ Cerrar dieta</button>`}`;document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>mealSheet(b.dataset.slot));$('#closeDiet')?.addEventListener('click',()=>call('close_diet',{},d=>{st.diet=d;renderDiet();loadHome();toast('Dieta cerrada')}))}
async function loadDiet(){st.diet=await call('diet');renderDiet()}function mealSheet(slot){const m=slots[slot]||['🍴',slot],opts=st.diet.options.filter(x=>x.slot===slot),sel=st.diet.selections.filter(x=>x.meal_slot===slot);sheet(`<div class="row between"><div><div class="ey">${m[0]} ${esc(m[1])}</div><div class="stat">Opciones</div></div><button class="btn secondary" id="x">×</button></div><div class="stack" style="margin-top:13px">${opts.map(o=>`<button class="btn secondary wide" data-pick="1" data-i="${o.option_index}" data-v="${esc(o.variant_key||'')}">${esc(o.label||'Opción')}</button>`).join('')||'<div class="empty">Sin opciones.</div>'}</div>${sel.length?`<div class="section">Registrado</div>${sel.map(s=>`<div class="card row between"><div><b>${esc(s.variant_text||s.option_text)}</b><div class="small">${esc(s.nutrition_status)}</div></div><button class="btn danger" data-undo="${s.id}">Quitar</button></div>`).join('')}:''}`);$('#x').onclick=close;document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>call('choose_meal',{slot,option_index:Number(b.dataset.i),variant_key:b.dataset.v},x=>{st.diet=x.diet;renderDiet();close();loadHome();toast('Comida registrada')}));document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>call('undo_meal',{selection_id:b.dataset.undo},x=>{st.diet=x;renderDiet();close();loadHome();toast('Eliminado')}))}
function renderWork(){const w=st.work;if(!w)return;if(!w.active){$('#work').innerHTML=`<div class="ey">Entrenamiento</div><div class="stat" style="margin:5px 0 14px">Elige tu día</div><div class="grid2">${[1,2,3,4,5].map(d=>`<button class="card" data-start="${d}" style="text-align:left;color:var(--text)"><div class="ey">Día</div><div class="stat">${d}</div><div class="small">${w.plans?.[d]?.plan?.length||0} ejercicios${w.plans?.[d]?.lastDate?' · Última '+w.plans[d].lastDate:''}</div></button>`).join('')}</div>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>call('start_workout',{day:Number(b.dataset.start)},x=>{st.work.active=x;renderWork();loadHome();toast('Entrenamiento iniciado')}));return}const a=w.active,e=a.exercise||{},sets=a.currentSets||[],planned=Math.max(1,Number((String(e.prescription||'').match(/^(\d+)x/i)||[])[1]||4));$('#work').innerHTML=`<div class="chips">${a.plan.map(x=>`<button class="chip ${x.exercise_code===e.exercise_code?'on':''}" data-ex="${esc(x.exercise_code)}">${esc(x.exercise_code)}</button>`).join('')}</div><div class="hero work"><div class="ey">Día ${a.workout.workout_day} · ${esc(e.prescription||'')}</div><h2>${esc(e.exercise_code)}. ${esc(e.exercise_name)}</h2>${a.previous?`<div class="ref"><b>Última ${esc(a.previous.date)}</b><br>${a.previous.sets.map(s=>`${n(s.weight_kg)?kg(s.weight_kg)+' kg × ':''}${s.reps}`).join(' · ')}</div>`:''}${a.insight?.suggested_weight!=null?`<div class="ref">🎯 Sugerido: <b>${kg(a.insight.suggested_weight)} kg</b></div>`:''}</div><div class="section">Nueva serie</div><div class="card"><div class="set"><b>#</b><span class="small">Peso kg</span><span class="small">Reps</span><span class="small">🔥</span><span class="small">🤝</span></div><div class="set"><b>${sets.length+1}</b><input id="wgt" inputmode="decimal" placeholder="0"><input id="reps" inputmode="numeric" placeholder="${planned}"><button class="flag" id="fail">🔥</button><button class="flag" id="assist">🤝</button></div><button class="btn primary wide" id="saveSet" style="margin-top:9px">✅ Registrar serie</button></div><div class="section">Series realizadas</div><div class="card">${sets.length?sets.map(s=>`<div class="food"><b>Serie ${s.set_order}</b><div class="small">${kg(s.weight_kg)} kg × ${s.reps}${s.to_failure?' · 🔥 fallo':''}${s.assisted?' · 🤝 asistida':''}</div></div>`).join(''):'<div class="empty">Todavía ninguna.</div>'}</div><div class="grid3"><button class="btn secondary" data-rest="60">⏱ 60</button><button class="btn secondary" data-rest="90">⏱ 90</button><button class="btn secondary" data-rest="120">⏱ 120</button></div><div class="grid2" style="margin-top:9px"><button class="btn secondary" id="undoSet">↩️ Serie</button><button class="btn danger" id="finishW">🏁 Terminar</button></div>`;document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>call('activate_exercise',{code:b.dataset.ex},x=>{st.work.active=x;renderWork()}));$('#fail').onclick=()=>$('#fail').classList.toggle('on');$('#assist').onclick=()=>$('#assist').classList.toggle('on');$('#saveSet').onclick=()=>{const reps=Number($('#reps').value),weight=$('#wgt').value;if(!reps)return toast('Introduce reps');call('add_sets',{sets:[{weight,reps,to_failure:$('#fail').classList.contains('on'),assisted:$('#assist').classList.contains('on')}]},x=>{st.work.active=x.active;renderWork();loadHome();toast('Serie guardada')})};document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>call('rest_timer',{seconds:Number(b.dataset.rest)},()=>toast('Descanso iniciado')));$('#undoSet').onclick=()=>call('undo_set',{},x=>{st.work.active=x;renderWork();toast('Última serie eliminada')});$('#finishW').onclick=()=>call('finish_workout',{},x=>{st.work=x.overview;renderWork();loadHome();toast(x.discarded?'Entreno vacío descartado':'Entrenamiento guardado')})}
async function loadWork(){st.work=await call('workouts');renderWork()}
function renderProgress(){const p=st.progress;if(!p)return;const wt=p.weightTrend||{},nu=p.nutrition||{};$('#progress').innerHTML=`<div class="ey">Progreso</div><div class="stat" style="margin:5px 0 14px">Tu evolución</div><div class="card"><div class="row between"><div><div class="ey">Peso</div><div class="stat">${wt.latest_weight!=null?kg(wt.latest_weight)+' kg':'—'}</div></div><span class="pill ${wt.state==='decreasing'?'good':''}">${wt.sufficient?(wt.state==='decreasing'?'↓ '+kg(Math.abs(wt.kg_per_week))+' kg/sem':wt.state==='stable'?'→ estable':'↑ '+kg(wt.kg_per_week)+' kg/sem'):'Datos insuficientes'}</span></div></div><div class="card"><div class="ey">Nutrición · 7 días</div><div class="grid3" style="margin-top:10px"><div><div class="stat">${Math.round(n(nu.current7?.avg_kcal))}</div><div class="small">kcal/día</div></div><div><div class="stat">${fmt(nu.current7?.avg_protein)}</div><div class="small">g proteína</div></div><div><div class="stat">${Math.round(n(nu.current7?.adherence_pct))}%</div><div class="small">adherencia</div></div></div></div><div class="section">Entrenamiento</div>${[1,2,3,4,5].map(d=>{const x=p.workoutProgress?.[d]||{};return `<div class="card"><div class="row between"><b>Día ${d}</b><span class="pill">${x.suggestions||0} sugerencias</span></div><div class="small" style="margin-top:8px">Mejorando ${x.improving||0} · Estables ${x.stable||0} · Estancados ${x.stagnating||0}</div></div>`}).join('')}`}
async function loadProgress(){st.progress=await call('progress');renderProgress()}
function weightSheet(){sheet(`<div class="ey">Peso</div><div class="stat">Registrar hoy</div><div class="card" style="margin-top:12px"><input id="weightInput" inputmode="decimal" placeholder="74,0" style="font-size:24px;font-weight:900"><button class="btn primary wide" id="saveWeight" style="margin-top:9px">⚖️ Guardar</button></div>`);$('#saveWeight').onclick=()=>call('set_weight',{weight:$('#weightInput').value},x=>{st.home=x.home;st.progress=x.progress;renderHome();close();toast('Peso guardado')})}
$('#more').onclick=()=>{const s=st.home?.session||{};sheet(`<div class="ey">FitValen</div><div class="stat">Más opciones</div><div class="stack" style="margin-top:13px"><button class="btn secondary wide" id="free">🍔 Día libre completo</button><button class="btn secondary wide" id="finishDay">🔒 Fin del día</button><button class="btn secondary wide" id="integrity">🛡️ Comprobar integridad</button><button class="btn secondary wide" id="x">Cerrar</button></div>`);$('#x').onclick=close;$('#integrity').onclick=()=>call('integrity',{repair:false},r=>toast(r.healthy?'Integridad OK':'Hay incidencias'));$('#finishDay').onclick=()=>call('finish_day',{},h=>{st.home=h;renderHome();close();toast('Día cerrado')});$('#free').onclick=()=>call('full_free_day',{force:false},x=>{if(x.result?.requires_confirmation){if(confirm('Hay comida registrada. ¿Marcar Día libre completo igualmente?'))call('full_free_day',{force:true},y=>{st.home=y.home;renderHome();close();toast('Día libre completo')})}else if(x.result?.ok){st.home=x.home;renderHome();close();toast('Día libre completo')}else toast('No se puede marcar Día libre')})};
async function boot(){if(!init){$('#status').textContent='Abre desde Telegram';$('#home').innerHTML='<div class="hero"><div class="ey">FitValen Mini App</div><div class="stat" style="margin-top:8px">Abre esta app desde Telegram.</div><p class="small">La sesión firmada de Telegram protege tus datos.</p></div>';return}await loadHome()}boot()})();
</script>
</body>
</html>
